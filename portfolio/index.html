<body class="is-loading">
    <noscript>
        <div style="padding: 2rem; text-align: center; color: white; background: #0f172a; font-family: sans-serif;">
            <h2>JavaScript is required</h2>
            <p>Please enable JavaScript in your browser to view this portfolio.</p>
        </div>
    </noscript>

    <!-- Background Decoration -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="mouse-glow" id="mouse-glow"></div>

    <!-- Loading Overlay -->
    <div id="app-loading-overlay" class="premium-loader-overlay">
        <div class="loader-bg-glow"></div>
        <div class="loader-particles" id="loader-particles"></div>

        <div class="loader-content">
            <div class="loader-logo-wrapper">
                <div class="loader-logo-glow"></div>
                <svg class="loader-logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#loaderLogoGradient)"/>
                    <path d="M42 18H22V46H42V40H28V34H39V30H28V24H42V18Z" fill="white"/>
                    <defs>
                        <linearGradient id="loaderLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="var(--primary)"/>
                            <stop offset="50%" stop-color="var(--secondary)"/>
                            <stop offset="100%" stop-color="var(--primary)"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <div class="loader-tech-stack">
                <div id="loader-tech-text">Android</div>
            </div>

            <div class="loader-progress-container">
                <div class="loader-progress-bar">
                    <div id="loader-progress-fill" class="loader-progress-fill"></div>
                </div>
                <div class="loader-percentage" id="loader-percentage">0%</div>
            </div>
        </div>
    </div>

    <!-- Section Mount Points -->
    <div id="navbar-mount"></div>
    <div id="project-page-mount" aria-live="polite"></div>

    <main>
        <div id="hero-mount"></div>
        <div id="about-mount"></div>
        <div id="projects-mount"></div>
        <div id="experience-mount"></div>
        <div id="skills-mount"></div>
        <div id="services-mount"></div>
        <div id="education-mount"></div>
        <div id="certifications-mount"></div>
        <div id="contact-mount"></div>
    </main>

    <div id="footer-mount"></div>

    <!-- Submission Status Modal -->
    <div id="submission-modal" class="status-modal" aria-hidden="true" role="dialog">
        <div class="status-modal-overlay"></div>
        <div class="status-modal-content">
            <div id="modal-state-sending" class="modal-state">
                <div class="modal-icon-wrapper">
                    <div class="floating-airplane">
                        <i class="ph-fill ph-paper-plane-tilt"></i>
                    </div>
                    <div class="glow-pulse"></div>
                </div>
                <h3>Sending your message...</h3>
                <div class="modal-progress-container">
                    <div class="modal-progress-bar"></div>
                </div>
                <div class="modal-particles"></div>
            </div>

            <div id="modal-state-success" class="modal-state" style="display: none;">
                <div class="modal-icon-wrapper success">
                    <div class="checkmark-circle">
                        <i class="ph ph-check"></i>
                    </div>
                    <div class="confetti-container"></div>
                </div>
                <h3>Message Sent Successfully</h3>
                <p>Your message has been delivered.<br>I'll get back to you as soon as possible.</p>
                <button class="btn btn-outline modal-close-btn">Continue Exploring</button>
            </div>

            <div id="modal-state-error" class="modal-state" style="display: none;">
                <div class="modal-icon-wrapper error">
                    <div class="error-circle">
                        <i class="ph ph-warning-circle"></i>
                    </div>
                </div>
                <h3>Something went wrong</h3>
                <p>Please try again in a few moments.</p>
                <div class="modal-btns">
                    <button class="btn btn-primary modal-retry-btn">Try Again</button>
                    <button class="btn btn-outline modal-close-btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
